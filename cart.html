<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cart — OFFGRID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --sage: #A9BCA5; --ivory: #F7F3E9; --stone: #D7D1C6; --graphite: #343A36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; background: var(--sage); color: var(--graphite); }
  body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; font-family: "Cinzel", Georgia, serif;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(247,243,233,.35), transparent 70%), var(--sage); }

  /* ---------- Navbar (same as the Air Purifiers page) ---------- */
  nav {
    position: relative; z-index: 5; margin: max(2vh, 14px) auto 0; width: fit-content;
    display: flex; justify-content: center; align-items: center;
    gap: clamp(1.2rem, 4.5vw, 4rem);
    max-width: calc(100vw - 24px);
    padding: .45rem clamp(1.2rem, 3vw, 2.4rem);
    border-radius: 999px; border: 1px solid rgba(247,243,233,.22);
    background: rgba(52,58,54,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  nav a {
    position: relative; padding: .5em 0;
    font-weight: 500; font-size: clamp(.64rem, 1vw, .85rem);
    letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    text-decoration: none; white-space: nowrap; color: rgba(247,243,233,.78); transition: color .35s;
  }
  nav a::after {
    content: ""; position: absolute; left: 50%; right: 50%; bottom: 0; height: 2px; border-radius: 2px; background: var(--sage);
    transition: left .4s cubic-bezier(.2,.8,.2,1), right .4s cubic-bezier(.2,.8,.2,1);
  }
  nav a:hover, nav a:focus-visible, nav a.active { color: var(--ivory); outline: none; }
  nav a:hover::after, nav a:focus-visible::after, nav a.active::after { left: 0; right: 0; }
  .cart-count { display: inline-grid; place-items: center; min-width: 1.7em; height: 1.7em; margin-left: .45em; padding: 0 .45em;
    border-radius: 999px; font-size: .82em; letter-spacing: 0; text-indent: 0; vertical-align: middle;
    background: rgba(247,243,233,.12); color: var(--ivory); transition: background .3s, color .3s; }
  .cart-count.has { background: var(--sage); color: #232826; }

  /* ---------- Cart ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: clamp(36px, 6vw, 72px) clamp(16px, 4vw, 48px) clamp(56px, 8vw, 100px); }
  .head { text-align: center; margin-bottom: clamp(28px, 4vw, 48px); }
  .head h1 { font-weight: 400; font-size: clamp(1.6rem, 4.5vw, 3rem); letter-spacing: .2em; text-indent: .2em; text-transform: uppercase; }
  .head .rule { width: 56px; height: 2px; border-radius: 2px; margin: 1.2rem auto 0; background: var(--graphite); opacity: .6; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: clamp(18px, 3vw, 36px); align-items: start; }
  .lines { list-style: none; display: grid; gap: 14px; }
  .line { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 18px; align-items: center;
    padding: 14px; border-radius: 16px; background: var(--ivory); border: 1px solid rgba(52,58,54,.12); box-shadow: 0 8px 24px rgba(52,58,54,.1); }
  .thumb { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 42%, transparent 54%),
                radial-gradient(ellipse 70% 60% at 50% 45%, rgba(169,188,165,.45), transparent 70%), linear-gradient(160deg, #e9e5db, var(--stone)); }
  .thumb span { font-size: .5rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(52,58,54,.45); }
  .name { font-weight: 500; font-size: .92rem; letter-spacing: .14em; text-transform: uppercase; }
  .unit { margin-top: .35rem; font-family: Georgia, "Times New Roman", serif; font-size: .9rem; color: rgba(52,58,54,.6); }
  .qty { margin-top: .7rem; display: inline-flex; align-items: center; border: 1px solid rgba(52,58,54,.3); border-radius: 999px; overflow: hidden; }
  .qty button { width: 34px; height: 32px; border: 0; background: transparent; color: var(--graphite); font-size: 1rem; cursor: pointer; transition: background .25s; }
  .qty button:hover, .qty button:focus-visible { background: rgba(169,188,165,.25); outline: none; }
  .qty output { min-width: 34px; text-align: center; font-family: Georgia, serif; font-size: .95rem; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .7rem; }
  .total { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; }
  .remove { font: inherit; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(52,58,54,.6);
    background: none; border: 0; border-bottom: 1px solid transparent; cursor: pointer; padding: 2px 0; transition: color .25s, border-color .25s; }
  .remove:hover, .remove:focus-visible { color: var(--graphite); border-color: var(--graphite); outline: none; }

  .summary { position: sticky; top: 20px; padding: 24px; border-radius: 18px; background: var(--ivory); border: 1px solid rgba(52,58,54,.12); box-shadow: 0 8px 24px rgba(52,58,54,.1); }
  .summary h2 { font-weight: 500; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: #5f7a5a; margin-bottom: 18px; }
  .summary dl { display: grid; grid-template-columns: 1fr auto; row-gap: 12px; font-family: Georgia, "Times New Roman", serif; font-size: .95rem; }
  .summary dt { color: rgba(52,58,54,.65); }
  .summary dd { text-align: right; }
  .summary .grand { margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(52,58,54,.14); font-size: 1.1rem; color: var(--graphite); }
  .btn { display: block; width: 100%; margin-top: 22px; padding: 1em 1.4em; border-radius: 999px; text-align: center; text-decoration: none; cursor: pointer;
    font: inherit; font-size: .74rem; letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    color: var(--ivory); background: var(--graphite); border: 1px solid var(--graphite); transition: background .3s, color .3s, border-color .3s; }
  .btn:hover, .btn:focus-visible { background: #5f7a5a; border-color: #5f7a5a; outline: none; }
  .btn.ghost { margin-top: 12px; color: var(--graphite); background: transparent; border-color: rgba(52,58,54,.4); }
  .btn.ghost:hover, .btn.ghost:focus-visible { background: rgba(169,188,165,.35); }
  .note { margin-top: 14px; font-family: Georgia, serif; font-size: .82rem; line-height: 1.5; color: rgba(52,58,54,.65); text-align: center; min-height: 1.2em; }

  .empty { text-align: center; padding: clamp(36px, 6vw, 64px) 16px; border-radius: 18px; background: var(--ivory); border: 1px solid rgba(52,58,54,.12); }
  .empty p { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; color: rgba(52,58,54,.75); }
  .empty .btn { display: inline-block; width: auto; padding: 1em 2.4em; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .summary { position: static; }
  }
  @media (max-width: 560px) {
    nav { gap: .9rem; padding-left: 1rem; padding-right: 1rem; }
    nav a { font-size: .6rem; letter-spacing: .16em; text-indent: .16em; padding: .75em 0; }
    .line { grid-template-columns: 72px minmax(0, 1fr); }
    .side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  }
</style>
</head>
<body>
  <nav aria-label="Primary">
    <a href="index.html">Home</a>
    <a href="air-purifiers.html">Air Purifiers</a>
    <a href="cart.html" class="active" aria-current="page">Cart<span class="cart-count" aria-label="items in cart">0</span></a>
  </nav>

  <main>
    <header class="head"><h1>Your Cart</h1><div class="rule"></div></header>
    <div id="view"></div>
  </main>

<script src="assets/cart.js"></script>
<script>
(() => {
  const Cart = window.OffgridCart, view = document.getElementById('view');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    const items = Cart.items();
    if (!items.length) {
      view.innerHTML = `<div class="empty"><p>Your cart is empty.</p><a class="btn" href="air-purifiers.html" style="margin-top:22px">Shop Air Purifiers</a></div>`;
      return;
    }
    const sub = Cart.subtotal();
    view.innerHTML = `
      <div class="layout">
        <ul class="lines">
          ${items.map(i => `
            <li class="line" data-id="${esc(i.id)}">
              <div class="thumb" role="img" aria-label="Product image placeholder"><span>Image</span></div>
              <div>
                <div class="name">${esc(i.name)}</div>
                <div class="unit">${Cart.money(i.price)} each</div>
                <div class="qty" role="group" aria-label="Quantity">
                  <button type="button" data-step="-1" aria-label="One fewer">&minus;</button>
                  <output aria-live="polite">${i.qty}</output>
                  <button type="button" data-step="1" aria-label="One more">+</button>
                </div>
              </div>
              <div class="side">
                <div class="total">${Cart.money(i.price * i.qty)}</div>
                <button type="button" class="remove">Remove</button>
              </div>
            </li>`).join('')}
        </ul>
        <aside class="summary" aria-label="Order summary">
          <h2>Order Summary</h2>
          <dl>
            <dt>Items</dt><dd>${Cart.count()}</dd>
            <dt>Subtotal</dt><dd>${Cart.money(sub)}</dd>
            <dt>Shipping</dt><dd>At checkout</dd>
            <dt class="grand">Total</dt><dd class="grand">${Cart.money(sub)}</dd>
          </dl>
          <button type="button" class="btn" id="checkout">Checkout</button>
          <a class="btn ghost" href="air-purifiers.html">Continue Shopping</a>
          <p class="note" id="note" aria-live="polite"></p>
        </aside>
      </div>`;
  }

  view.addEventListener('click', e => {
    const line = e.target.closest('.line');
    if (line) {
      const id = line.dataset.id, cur = Cart.items().find(i => i.id === id);
      const step = e.target.closest('[data-step]');
      if (step && cur) Cart.setQty(id, cur.qty + Number(step.dataset.step));
      if (e.target.closest('.remove')) Cart.remove(id);
    }
    if (e.target.closest('#checkout')) {
      // checkout is not connected to a payment provider yet
      document.getElementById('note').textContent = 'Checkout is coming soon. Questions? reach.offgrid@gmail.com';
    }
  });
  document.addEventListener('cart:change', render);
  render();
})();
</script>
</body>
</html>
